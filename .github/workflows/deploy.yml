name: Offline Evaluation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: offline-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Self-test eval runner
        run: uv run python evals/offline.py --self-test

      - name: Run offline eval regression check
        env:
          LC_GATEWAY_KEY: ${{ secrets.LC_GATEWAY_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_TRACING: "true"
          LANGSMITH_PROJECT: ambient-analyst
        run: uv run python evals/offline.py --regression-check
