name: Offline Evaluation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: offline-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run offline evals against deployment
        run: uv run python -m src.evals.run_deployed
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          DEPLOYMENT_URL: ${{ secrets.DEPLOYMENT_URL }}
