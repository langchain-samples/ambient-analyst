[project]
name = "ambient-analyst"
version = "0.1.0"
description = "A DeepAgents macroeconomic and business analyst with dynamic subagents and sandboxed analysis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.6.7",
    "langchain>=1.3.2",
    "langchain-mcp-adapters>=0.2.2",
    "langchain-quickjs>=0.2.0",
    "langchain-tavily>=0.2.18",
    "langgraph-cli[inmem]>=0.4.27",
    "langsmith[sandbox]>=0.8.0",
    "openevals>=0.2.0",
]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

# Only the agent package is installable. Without this, setuptools' flat-layout
# auto-discovery sees both `ambient_analyst` and `evals` as top-level packages
# and aborts ("Multiple top-level packages discovered"), failing the deploy
# build. `namespaces = true` keeps discovery working without `__init__.py` files.
[tool.setuptools.packages.find]
include = ["ambient_analyst*"]
namespaces = true
