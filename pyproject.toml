[project]
name = "ambient-analyst"
version = "0.1.0"
description = "A DeepAgents macroeconomic and business analyst with dynamic subagents and sandboxed analysis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.6.7",
    "langchain>=1.3.2",
    "langchain-mcp-adapters>=0.2.2",
    "langchain-quickjs>=0.2.0",
    "langchain-tavily>=0.2.18",
    "langgraph-cli[inmem]>=0.4.27",
    "langsmith[livekit,sandbox]>=0.10.4",
    "livekit-agents[langchain,openai,silero]~=1.5",
    "openevals>=0.2.0",
]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent*"]
namespaces = true
